<style>

  @font-face { font-family:"Cranberry"; font-display:swap;
    src:local("Cranberry"), local("Cranberry Regular"), url("assets/fonts/Cranberry.woff2") format("woff2"), url("assets/fonts/Cranberry.ttf") format("truetype"), url("assets/fonts/Cranberry.otf") format("opentype"); }
  @font-face { font-family:"Handy Casual"; font-display:swap;
    src:local("Handy Casual"), local("HandyCasual"), url("assets/fonts/HandyCasual.woff2") format("woff2"), url("assets/fonts/HandyCasual.ttf") format("truetype"), url("assets/fonts/HandyCasual.otf") format("opentype"); }
  /* ============================================================
     Wild Worlds — match animals to their homes and their food.
     Built with Phaser 3. Everything lives in this one file.
     ============================================================ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  }
  body {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(190,240,120,.35), transparent 60%),
      linear-gradient(180deg, #2f8a3c 0%, #1d5c2a 55%, #123f1f 100%);
  }
  #game { position:absolute; inset:0; }
  #game canvas { display:block; border-radius:18px; box-shadow:0 12px 50px rgba(0,0,0,.45); }

  /* ---------- loading splash ---------- */
  #splash {
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3.5vmin; color:#fff; text-align:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(210,250,140,.45), transparent 60%),
      linear-gradient(180deg, #3fa049 0%, #1d5c2a 60%, #123f1f 100%);
    transition:opacity .5s ease;
  }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .logoimg {
    width:46vmin; height:46vmin; border-radius:50%; object-fit:cover; background:#fff;
    border:1.2vmin solid #e2ad6b; outline:.7vmin solid #6e431f; box-shadow:0 1.6vmin 0 rgba(0,0,0,.25);
    animation:splashBob 2.4s ease-in-out infinite;
  }
  #splash .logo {
    font-family:"Cranberry","Lilita One","Fredoka",sans-serif; font-size:13vmin; line-height:1;
    color:#ffd84a; -webkit-text-stroke:.5vmin #7a3e12; paint-order:stroke fill;
    text-shadow:0 1vmin 0 rgba(0,0,0,.25);
    animation:splashBob 2.4s ease-in-out infinite;
  }
  @keyframes splashBob { 0%,100%{ transform:translateY(0) rotate(-1.5deg);} 50%{ transform:translateY(-1.6vmin) rotate(1.5deg);} }
  #splash .bar { width:min(60vw,520px); height:3.4vmin; min-height:18px; border-radius:99px; background:rgba(0,0,0,.3); border:.5vmin solid #fff6d8; overflow:hidden; }
  #splash .bar i { display:block; height:100%; width:5%; border-radius:99px; background:linear-gradient(180deg,#c6f25a,#62be2e); transition:width .2s ease; }
  #splash p { font-family:"Handy Casual","Patrick Hand","Fredoka",sans-serif; font-size:3.8vmin; opacity:.95; padding:0 6vw; }

  /* ---------- "turn your tablet" hint (phones / tablets held upright) ---------- */
  #rotate {
    position:absolute; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:5vmin; background:#1d5c2a; color:#fff; font-size:6vmin; font-weight:700; text-align:center; padding:8vmin;
  }
  #rotate span { font-size:22vmin; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25%{ transform:rotate(0);} 60%,100%{ transform:rotate(-90deg);} }
  @media (orientation:portrait) and (max-width:900px) { #rotate { display:flex; } }
</style>
</head>
<body>

<div id="game"></div>

<div id="splash">

  <div class="logo" hidden>Wild Worlds</div>
  <div class="bar"><i id="splashBar"></i></div>

<div id="rotate"><span>📱</span>Turn your tablet sideways to play!</div>

  key: 'wildworlds.v1',
  data: { best:{}, quizBest:0, stickers:{}, music:true, sfx:true },
  load(){ try { Object.assign(this.data, JSON.parse(localStorage.getItem(this.key) || '{}')); } catch (e) { /* private mode: play without saving */ } },
  store(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  totalStars(){ return Object.values(this.data.best).reduce((s, v) => s + v, 0); }
};

const Sound = {
  ctx:null, mBus:null, sBus:null, files:{}, theme:null, _timer:null, _fileEl:null, _step:0, _next:0, _noiseBuf:null,

  /* look for optional audio files */
  probe(){
    if (!USE_FILE_ASSETS) return;
    const add = (key, path, loop) => {
      const a = new Audio(); a.preload = 'auto'; a.loop = !!loop;
      a.addEventListener('canplaythrough', () => {
        this.files[key] = a;
        if (loop && this.theme && key === 'music_' + this.theme) this.playMusic(this.theme, true);
      }, { once:true });
      a.addEventListener('error', () => {});
      a.src = path;
    };
    MUSIC_NAMES.forEach(n => add('music_' + n, `assets/audio/music/${n}.${ASSET_AUDIO_EXT}`, true));
    SFX_NAMES.forEach(n => add('sfx_' + n, `assets/audio/sfx/${n}.${ASSET_AUDIO_EXT}`));
  },

  /* browsers only allow sound after the first tap */
  unlock(){
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const comp = this.ctx.createDynamicsCompressor(); comp.connect(this.ctx.destination);
      this.mBus = this.ctx.createGain(); this.mBus.gain.value = 0.42; this.mBus.connect(comp);
      this.sBus = this.ctx.createGain(); this.sBus.gain.value = 0.9;  this.sBus.connect(comp);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.theme && !this._timer && !this._fileEl) this.playMusic(this.theme, true);
  },

  playMusic(theme, force){
    if (theme === this.theme && !force) return;
    this.stopMusic(); this.theme = theme;
    if (!Save.data.music) return;
    const f = this.files['music_' + theme];
    if (f) { f.currentTime = 0; f.volume = 0.5; f.play().catch(() => {}); this._fileEl = f; return; }
    if (!this.ctx || !THEMES[theme]) return;
    this._step = 0; this._next = this.ctx.currentTime + 0.08;
    this._timer = setInterval(() => this._pump(), 60);
  },
  stopMusic(){
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    if (this._fileEl) { this._fileEl.pause(); this._fileEl = null; }
  },
  setMusic(on){ Save.data.music = on; Save.store(); if (on) this.playMusic(this.theme, true); else this.stopMusic(); },
  setSfx(on){ Save.data.sfx = on; Save.store(); if (!on && window.speechSynthesis) speechSynthesis.cancel(); },

  _pump(){
    const T = THEMES[this.theme]; if (!T || !this.ctx || this.ctx.state !== 'running') return;
    if (this._next < this.ctx.currentTime - 0.3) this._next = this.ctx.currentTime + 0.05;   // tab was asleep
    const spb = 60 / T.bpm / 2;
    while (this._next < this.ctx.currentTime + 0.25) {
      this._schedule(T, this._step, this._next, spb);
      this._next += spb; this._step = (this._step + 1) % T.mel.length;

  _schedule(T, step, t, spb){
    const b = this.mBus, s = step % 8, chord = T.prog[Math.floor(step / 8)];
    const m = T.mel[step];
    if (m != null) {
      let len = 1; while (len < 6 && T.mel[(step + len) % T.mel.length] == null) len++;
      this.note(T.lead, degToMidi(T.root + 12, m), t, len * spb, b, 1);
    }
    if (s === 0) this.note('bass', degToMidi(T.root - 12, chord), t, spb * 3, b, 1);
    if (s === 4) this.note('bass', degToMidi(T.root - 12, chord + 4), t, spb * 2, b, .8);
    if (T.comp && T.comp.includes(s)) [0, 2, 4].forEach(k => this.note('marimba', degToMidi(T.root, chord + k), t, spb, b, .32));
    if (T.pad && s === 0) [0, 2, 4].forEach(k => this.note('pad', degToMidi(T.root, chord + k), t, spb * 8, b, 1));
    if (T.shaker) this.noise(t, .05, s % 2 ? .035 : .06, 7000, 'highpass', b);
    if (T.kick && (s === 0 || s === 4)) this.glide(130, 50, t, .14, .5, 'sine', b);

  /* ---- tiny synthesiser ---- */
  _osc(type, f, t, dur){ const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + .05); return o; },
  _pluck(o, t, attack, peak, decay, bus){

  note(inst, midi, t, len, bus, vol){

      this._pluck(this._osc('sine', f, t, .5), t, .004, .30 * vol, .42, bus);
      this._pluck(this._osc('sine', f * 4, t, .15), t, .002, .06 * vol, .09, bus);
    } else if (inst === 'bell') {
      this._pluck(this._osc('sine', f, t, 1.7), t, .006, .22 * vol, 1.6, bus);
      this._pluck(this._osc('sine', f * 2.01, t, .8), t, .004, .06 * vol, .7, bus);
    } else if (inst === 'bass') {
      this._pluck(this._osc('triangle', f, t, len + .3), t, .01, .30 * vol, len + .2, bus);
    } else if (inst === 'flute') {
      const o = this._osc('triangle', f, t, len + .35);

      l.frequency.value = 5.5; lg.gain.value = f * .006; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + len + .4);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.17 * vol, t + .05);
      g.gain.setValueAtTime(.17 * vol, t + Math.max(.06, len - .04)); g.gain.linearRampToValueAtTime(.0001, t + len + .28);
      o.connect(g); g.connect(bus);
    } else if (inst === 'pad') {
      const o = this._osc('sine', f, t, len + .5), g = c.createGain();
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.055 * vol, t + len * .35); g.gain.linearRampToValueAtTime(.0001, t + len + .4);
      o.connect(g); g.connect(bus);
    }

  glide(f1, f2, t, dur, vol, type, bus){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bus || this.sBus); o.start(t); o.stop(t + dur + .05);
  },
  noise(t, dur, vol, freq, type, bus){
    const c = this.ctx;
    if (!this._noiseBuf) {
      this._noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = this._noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(bus || this.sBus); src.start(t, Math.random() * .5); src.stop(t + dur + .02);
  },

  sfx(name){
    if (!Save.data.sfx) return;
    const f = this.files['sfx_' + name];
    if (f) { const a = f.cloneNode(); a.volume = .85; a.play().catch(() => {}); return; }
    if (!this.ctx || this.ctx.state !== 'running') return;

      case 'click':   N(76, 0, 'marimba', .8); break;
      case 'tap':     this.glide(520, 880, t, .09, .18); this.glide(880, 620, t + .09, .1, .14); break;
      case 'pickup':  this.glide(380, 760, t, .12, .22); break;
      case 'putback': this.glide(520, 300, t, .14, .16); break;
      case 'pop':     this.glide(300, 900, t, .09, .2); break;
      case 'whoosh':  this.noise(t, .3, .16, 1200, 'bandpass', b); break;
      case 'correct': [72, 76, 79, 84].forEach((m, i) => N(m, i * .08, 'bell', 1.1)); break;
      case 'wrong':   this.glide(300, 220, t, .16, .2, 'triangle'); this.glide(240, 170, t + .17, .22, .2, 'triangle'); break;
      case 'star':    N(91, 0, 'bell', .9); N(96, .07, 'bell', .8); break;
      case 'munch':   [0, .15, .3].forEach(d => { this.noise(t + d, .09, .3, 900, 'lowpass', b); this.glide(190, 120, t + d, .08, .16); }); break;
      case 'fanfare':
        [60, 64, 67, 72, 67, 72, 76].forEach((m, i) => N(m, i * .11, 'marimba', 1.3));
        [72, 76, 79, 84].forEach(m => N(m, .82, 'bell', 1));
        [88, 91, 96].forEach((m, i) => N(m, 1.0 + i * .09, 'bell', .6));

    }
  }
};

/* read text aloud (helps children who are still learning to read) */
function speak(text){
  if (!Save.data.sfx || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/["“”]/g, ''));
    const vs = speechSynthesis.getVoices();
    u.voice = vs.find(v => v.lang === 'en-AU') || vs.find(v => v.lang && v.lang.startsWith('en')) || null;
    u.rate = .92; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) { /* speech not available */ }
}

  else { if (Sound.ctx) Sound.ctx.resume(); if (Sound._fileEl && Save.data.music) Sound._fileEl.play().catch(() => {}); }
});

      onto canvas textures once and reused.

function rng(seed){ let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function hex2rgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a){ const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function rr(c, x, y, w, h, r){ r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function vgrad(c, y0, y1, stops){ const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function circ(c, x, y, r, col){ c.fillStyle = col; c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, 6.2832); c.fill(); }
function ell(c, x, y, rx, ry, col, rot){ c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, 6.2832); c.fill(); }
function starPath(c, x, y, R, r){ c.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } c.closePath(); }

function makeTex(scene, key, w, h, draw){
  if (scene.textures.exists(key)) return key;
  const t = scene.textures.createCanvas(key, Math.ceil(w), Math.ceil(h));
  draw(t.getContext(), w, h); t.refresh();
  return key;
}

/* a zig-zag outline: the "spiky" shape used only for wrong / unsafe choices */
function spikyPath(c, x, y, w, h, t){
  const pts = [], side = (x1, y1, x2, y2, nx, ny) => {
    const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / (t * 2.4)));
    for (let i = 0; i < n; i++){ const p = i / n, q = (i + .5) / n; pts.push([x1 + (x2 - x1) * p, y1 + (y2 - y1) * p], [x1 + (x2 - x1) * q + nx * t, y1 + (y2 - y1) * q + ny * t]); }
  };
  side(x + t, y + t, x + w - t, y + t, 0, -1); side(x + w - t, y + t, x + w - t, y + h - t, 1, 0);
  side(x + w - t, y + h - t, x + t, y + h - t, 0, 1); side(x + t, y + h - t, x + t, y + t, -1, 0);
  c.beginPath(); pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath();
}
const BTN = {
  green:  { top:'#b2ee54', bot:'#57b82c', edge:'#2f7d1b', lip:'#256414', text:'#ffffff', stroke:'#2a6b17' },
  orange: { top:'#ffd957', bot:'#f9951f', edge:'#b8600e', lip:'#8f4708', text:'#ffffff', stroke:'#9a4c08' },
  blue:   { top:'#8ae2ff', bot:'#2fa5e8', edge:'#17699f', lip:'#0f4f7c', text:'#ffffff', stroke:'#11557f' },
  pink:   { top:'#ffa9c6', bot:'#f0508a', edge:'#a82458', lip:'#821942', text:'#ffffff', stroke:'#8c1c4a' },
  cream:  { top:'#fffdf2', bot:'#f6e3b4', edge:'#b98a48', lip:'#8c6530', text:'#6b4420', stroke:null },
  wood:   { top:'#e2ad6b', bot:'#b27434', edge:'#6e431f', lip:'#4f2e13', text:'#ffffff', stroke:'#4f2e13' },
  danger: { top:'#565C6E', bot:'#3E4352', edge:'#2A2E3A', lip:'#2A2E3A', text:'#ffffff', stroke:null, spiky:true }
};
function btnTex(scene, w, h, col, round){
  return makeTex(scene, `btn_${col}_${w}x${h}${round ? 'r' : ''}`, w + 8, h + 18, c => {
    const p = BTN[col], r = round ? h / 2 : Math.min(36, h / 2.3);
    if (p.spiky) {
      c.fillStyle = p.lip; spikyPath(c, 4, 9, w, h, 13); c.fill();
      c.fillStyle = vgrad(c, 2, 2 + h, [p.top, p.bot]); spikyPath(c, 4, 2, w, h, 13); c.fill();
      return;
    }
    c.fillStyle = 'rgba(0,0,0,.22)'; rr(c, 4, 14, w, h, r); c.fill();
    c.fillStyle = p.lip; rr(c, 4, 10, w, h, r); c.fill();
    c.fillStyle = vgrad(c, 2, 2 + h, [p.top, p.bot]); rr(c, 4, 2, w, h, r); c.fill();
    c.fillStyle = 'rgba(255,255,255,.3)'; rr(c, 4 + h * .16, 2 + h * .1, w - h * .32, h * .34, r * .6); c.fill();
    c.lineWidth = 5; c.strokeStyle = p.edge; rr(c, 6.5, 4.5, w - 5, h - 5, r - 2); c.stroke();

const btnOriginY = h => (2 + h / 2) / (h + 18);

function panelTex(scene, w, h, style){
  return makeTex(scene, `pn_${style}_${w}x${h}`, w + 8, h + 16, c => {
    const x = 4, y = 2, r = style === 'dark' ? h / 2 : Math.min(40, h * .28);
    if (style === 'dark') {
      c.fillStyle = 'rgba(24,56,26,.78)'; rr(c, x, y, w, h, r); c.fill();
      c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.6)'; rr(c, x + 2, y + 2, w - 4, h - 4, r - 2); c.stroke();
      return;
    }
    if (style === 'danger') {
      c.fillStyle = '#2A2E3A'; spikyPath(c, x, y + 7, w, h, 14); c.fill();
      c.fillStyle = vgrad(c, y, y + h, ['#565C6E', '#3E4352']); spikyPath(c, x, y, w, h, 14); c.fill();
      return;
    }
    c.fillStyle = 'rgba(0,0,0,.25)'; rr(c, x, y + 12, w, h, r); c.fill();
    if (style === 'wood') {
      c.fillStyle = '#5a3414'; rr(c, x, y + 7, w, h, r); c.fill();
      c.fillStyle = vgrad(c, y, y + h, ['#e6b272', '#c98a48', '#b27434']); rr(c, x, y, w, h, r); c.fill();
      c.save(); rr(c, x, y, w, h, r); c.clip();
      const R = rng(w * 7 + h); c.strokeStyle = 'rgba(110,62,22,.2)'; c.lineWidth = 3;
      for (let i = 0; i < h / 12; i++){ const yy = y + R() * h; c.beginPath(); c.moveTo(x, yy); c.bezierCurveTo(x + w * .3, yy + R() * 16 - 8, x + w * .6, yy + R() * 16 - 8, x + w, yy + R() * 12 - 6); c.stroke(); }
      c.restore();
      c.lineWidth = 7; c.strokeStyle = '#6e431f'; rr(c, x + 3.5, y + 3.5, w - 7, h - 7, r - 2); c.stroke();
      c.lineWidth = 3; c.strokeStyle = 'rgba(255,236,190,.55)'; rr(c, x + 11, y + 11, w - 22, h - 22, r - 9); c.stroke();
    } else {
      c.fillStyle = '#8c6530'; rr(c, x, y + 7, w, h, r); c.fill();
      c.fillStyle = style === 'card' ? vgrad(c, y, y + h, ['#eaffc4', '#fff6d6']) : vgrad(c, y, y + h, ['#fffdf2', '#fbecc2']);
      rr(c, x, y, w, h, r); c.fill();
      c.lineWidth = 7; c.strokeStyle = '#c2914b'; rr(c, x + 3.5, y + 3.5, w - 7, h - 7, r - 2); c.stroke();
      c.setLineDash([12, 10]); c.lineWidth = 3; c.strokeStyle = 'rgba(194,145,75,.5)'; rr(c, x + 15, y + 15, w - 30, h - 30, r - 12); c.stroke(); c.setLineDash([]);
    }
  });
}

/* small shared textures: particles, badge, thought bubble, zone glow, shadow */
function buildCommonTextures(scene){

/* turn an SVG string into an <img>, then into a sticker-style texture */
function loadSvg(str, size){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img); img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str.replace('<svg ', `<svg width="${size}" height="${size}" `));
  });
}
function stickerize(img, size, pad, outline){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d'), d = size - pad * 2;
  if (outline) {
    const o = document.createElement('canvas'); o.width = o.height = size; const k = o.getContext('2d');
    for (let i = 0; i < 18; i++){ const a = i / 18 * 6.2832; k.drawImage(img, pad + Math.cos(a) * outline, pad + Math.sin(a) * outline, d, d); }
    k.globalCompositeOperation = 'source-in'; k.fillStyle = '#fff'; k.fillRect(0, 0, size, size);
    c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = outline * 1.2; c.shadowOffsetY = outline * .7;
    c.drawImage(o, 0, 0); c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  }
  c.drawImage(img, pad, pad, d, d);
  return cv;
}
async function buildArtTextures(scene, onProgress){
  const jobs = []; let done = 0;
  const add = (key, str, size, pad, outline) => {
    if (scene.textures.exists(key)) return;            // a file from assets/ was loaded instead
    if (!str) { console.warn('Wild Worlds: no artwork for', key); return; }
    jobs.push(loadSvg(str, size).then(img => {
      if (img) scene.textures.addCanvas(key, stickerize(img, size, pad, outline)); else console.warn('Wild Worlds: could not draw', key);
      onProgress(++done / jobs.length);
    }));
  };
  ANIMALS.forEach(a => add('animal_' + a.id, ART[a.art || a.id], 448, 20, 7));
  Object.keys(FOODS).forEach(f => add('food_' + f, FOOD_ART[f], 224, 14, 5));
  Object.keys(ICONS).forEach(k => add('ic_' + k, ICONS[k], 128, 0, 0));
  ['butterfly', 'jellyfish', 'bluetang'].forEach(k => add('deco_' + k, ART[k], 192, 6, 0));
  await Promise.all(jobs);
}

function T(scene, x, y, str, size, color, o){
  o = o || {};

  const t = scene.add.text(x, y, str, style).setOrigin(o.ox === undefined ? .5 : o.ox, o.oy === undefined ? .5 : o.oy);
  if (o.stroke) t.setStroke(o.stroke, o.strokeW || 8);
  if (o.shadow) t.setShadow(0, o.shadow, 'rgba(0,0,0,.3)', 0, true, true);

}

function Btn(scene, x, y, w, h, label, col, cb, o){

/* ---------- A habitat world: drag animals home, then feed them ---------- */
const GEN_BG = new Set();          // scenery painted in code (freed when another world opens)

class WorldScene extends Phaser.Scene {
  constructor(){ super('World'); }
  init(d){ this.wkey = (d && d.world) || 'safari'; this.W = WORLDS[this.wkey]; }

  create(){
    const W = this.W, wk = this.wkey, nz = W.zones.length;
    this.nz = nz; this.WW = nz * ZW;
    this.phase = 'pick'; this.stars = 0; this.helped = 0; this.miss = {}; this.current = null;
    this.dragObj = null; this.overlayOpen = false; this.pan = null; this.targetX = 0; this.zoneNow = -1;
    this.placed = {}; this.foodCards = []; this.slots = [null, null, null, null];
    this.queue = Phaser.Utils.Array.Shuffle(W.animals.slice());
    this.input.dragDistanceThreshold = 10;

    /* free the painted scenery of other worlds, then paint this one */
    GEN_BG.forEach(k => { if (!k.includes('_' + wk)) { if (this.textures.exists(k)) this.textures.remove(k); GEN_BG.delete(k); } });
    const gen = (key, w, h, draw) => { if (!this.textures.exists(key)) { makeTex(this, key, w, h, draw); GEN_BG.add(key); } return key; };
    this.add.image(0, 0, gen('sky_' + wk, GW, GH, c => SKY[wk](c))).setOrigin(0).setScrollFactor(0).setDepth(0);
    const FW = Math.ceil(GW + (this.WW - GW) * FAR_SF);
    this.add.image(0, 0, gen('far_' + wk, FW, 720, c => paintFar(c, wk, FW))).setOrigin(0).setScrollFactor(FAR_SF, 1).setDepth(1);
    W.zones.forEach((z, i) => this.add.image(i * ZW, 0, gen(`bg_${wk}_${z.id}`, ZW, GH, c => paintZone(c, wk, i))).setOrigin(0).setDisplaySize(ZW, GH).setDepth(2));

    /* hanging name signs + the "drop here" glow */
    this.signs = W.zones.map((z, i) => {
      const s = this.add.container(i * ZW + GW / 2, 296).setDepth(40);
      s.add(this.add.rectangle(-200, -60, 8, 90, 0x6e431f)); s.add(this.add.rectangle(200, -60, 8, 90, 0x6e431f));
      s.add(Panel(this, 0, 0, 560, 86, 'wood'));
      s.add(T(this, 0, -3, z.name, 46, '#fff6d8', { title: true, stroke: '#5a3414', strokeW: 9 }));
      this.tweens.add({ targets: s, angle: { from: -1.2, to: 1.2 }, duration: 2400 + i * 300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      return s;
    });
    this.glow = this.add.image(0, 330, 'zone_glow').setOrigin(0).setDisplaySize(ZW - 120, 500).setDepth(45).setVisible(false);
    this.tweens.add({ targets: this.glow, alpha: { from: 1, to: .55 }, duration: 480, yoyo: true, repeat: -1 });

    this.ambience();
    this.cameras.main.setBounds(0, 0, this.WW, GH);
    this.buildHud(); this.buildTray();

    /* swipe the world sideways */
    this.input.on('pointerdown', (p, over) => {
      if (this.phase !== 'pick' || this.overlayOpen || p.y < 220 || p.y > TRAY_TOP) return;
      if (over.some(o => o.getData && o.getData('ui'))) return;
      this.pan = { x: p.x, zone: Math.round(this.targetX / ZW) };
    });
    this.input.on('pointermove', p => { if (this.pan && p.isDown && !this.dragObj) this.targetX = this.pan.zone * ZW - (p.x - this.pan.x) * 1.15; });
    this.input.on('pointerup', p => {
      if (!this.pan) return;
      const dx = p.x - this.pan.x; let z = this.pan.zone; if (Math.abs(dx) > 110) z -= Math.sign(dx);
      this.targetX = Phaser.Math.Clamp(z, 0, nz - 1) * ZW; this.pan = null;
    });
    this.input.keyboard.on('keydown-LEFT', () => this.nudge(-1));
    this.input.keyboard.on('keydown-RIGHT', () => this.nudge(1));

    for (let i = 0; i < 4; i++) this.fillSlot(i, 250 + i * 110);
    this.say('Drag each animal to the place where it lives!');
    Sound.playMusic(wk);
    this.cameras.main.fadeIn(350, 16, 60, 26);

        else { const d = R(500, 900); this.tweens.add({ targets: s, x: s.x - d, duration: d * 14, yoyo: true, repeat: -1, ease: 'Sine.easeInOut', onYoyo: () => s.setFlipX(true), onRepeat: () => s.setFlipX(false) }); }

      for (let i = 0; i < 7; i++){

  refreshTray(){

  say(msg){

  slotX(i, n){ n = n || 4; return GW / 2 - (n - 1) * 124 + i * 248; }
  fillSlot(i, delay){
    if (this.slots[i] || !this.queue.length) return;

    c.slot = i; this.slots[i] = c;

  }
  canDrag(c){ return !this.overlayOpen && !c.used && ((c.kind === 'animal' && this.phase === 'pick') || (c.kind === 'food' && this.phase === 'food')); }
  tapCard(c){
    Sound.sfx('tap'); this.tweens.add({ targets: c, y: c.homeY - 26, duration: 130, yoyo: true });

      if (m >= 2) { this.say(`Clue: "${a.clue}" Look for the ${a.zoneName}!`); const pill = this.pills[a.zone]; this.tweens.add({ targets: pill, scale: 1.22, duration: 220, yoyo: true, repeat: 4 }); }

    this.tweens.add({ targets: shine, alpha: .3, duration: 200, hold: 260, yoyo: true, onComplete: () => shine.destroy() });
    this.targetX = a.zone * ZW;

  }
  spawnAnimal(a, fromX, fromY){
    const land = a.gy !== undefined, x = a.zone * ZW + a.x, y = land ? a.gy : a.cy;
    const sp = this.add.image(fromX, fromY, 'animal_' + a.id).setOrigin(.5, land ? (a.foot || .85) : .5);
    const s = a.size / Math.max(sp.width, sp.height); sp.setScale(s * .5).setDepth(100 + y / 10);
    sp.homeX = x; sp.homeY = y; sp.baseS = s; this.placed[a.id] = sp;
    if (land && !a.perch) this.add.image(x, y - 4, 'shadow').setDisplaySize(a.size * .8, a.size * .2).setDepth(99);
    this.tweens.add({ targets: sp, x, y, scale: s, duration: 560, ease: 'Back.easeOut', onComplete: () => {
      if (land) this.tweens.add({ targets: sp, scaleY: s * 1.035, duration: 1100 + Math.random() * 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      else { this.tweens.add({ targets: sp, y: y - 16, duration: 1700 + Math.random() * 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }); this.tweens.add({ targets: sp, angle: { from: -2.5, to: 2.5 }, duration: 2300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }); }
    } });
    sp.setInteractive({ useHandCursor: true });
    sp.on('pointerup', p => { if (this.overlayOpen || this.dragObj || Math.abs(p.x - p.downX) > 20) return; Sound.sfx('tap'); speak(a.name); burst(this, sp.x, sp.y - (land ? a.size * .45 : 0), 'p_heart', 5); this.tweens.add({ targets: sp, y: sp.homeY - 34, duration: 160, yoyo: true, ease: 'Quad.easeOut' }); });
    return sp;
  }

  /* ----- step 2: what does it eat? ----- */
  startFood(a){
    this.phase = 'food'; this.current = a;
    this.slots.forEach(c => { if (c) this.tweens.add({ targets: c, y: GH + 160, duration: 220 }); });
    const opts = Phaser.Utils.Array.Shuffle([a.food].concat(a.wrong));
    this.foodCards = opts.map((f, i) => this.makeCard('food', f, this.slotX(i, 3), 200 + i * 110));
    const sp = this.placed[a.id], b = sp.getBounds();
    this.bubble = this.add.container(Phaser.Math.Clamp(b.centerX + a.size * .28, a.zone * ZW + 260, a.zone * ZW + ZW - 260), Math.max(400, b.top - 20)).setDepth(600);
    this.bubble.add(this.add.image(0, 0, 'bubble')); this.bubble.add(T(this, 0, -22, '?', 110, '#2a9fe0', { title: true }));
    this.bubble.setScale(0); this.tweens.add({ targets: this.bubble, scale: 1, duration: 300, ease: 'Back.easeOut', onComplete: () => this.tweens.add({ targets: this.bubble, y: this.bubble.y - 12, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }) });
    this.say(`The ${a.name} is hungry! What does it eat?`);
    this.refreshTray();
  }
  dropFood(c, p){
    const a = this.current, sp = this.placed[a.id];
    const box = Phaser.Geom.Rectangle.Inflate(sp.getBounds(), 60, 60), wx = p.x + this.cameras.main.scrollX, wy = p.y - 36;
    if (!box.contains(wx, wy) && !box.contains(wx, p.y)) { Sound.sfx('putback'); this.returnCard(c); return; }
    if (c.id !== a.food) {
      this.miss[a.id] = (this.miss[a.id] || 0) + 1;
      Sound.sfx('wrong'); c.used = true; c.bg.setTexture(panelTex(this, 224, 190, 'danger')); c.lab.setColor('#ffffff'); c.img.setAlpha(.55); this.returnCard(c, true);
      dangerBurst(this, sp.getBounds().centerX, sp.getBounds().centerY, false, 210);
      this.tweens.add({ targets: sp, x: sp.homeX + 16, duration: 60, yoyo: true, repeat: 3 });
      this.say(`Yuck! The ${a.name} doesn't eat ${FOODS[c.id].name.toLowerCase()}. Try another food!`);
      return;
    }
    this.phase = 'busy'; c.used = true;
    const b = sp.getBounds(), cam = this.cameras.main;
    this.tweens.add({ targets: c, x: b.centerX - cam.scrollX, y: b.centerY, scale: .1, duration: 380, ease: 'Cubic.easeIn', onComplete: () => {
      c.setVisible(false); Sound.sfx('munch');
      this.tweens.add({ targets: sp, scaleX: sp.baseS * 1.1, duration: 130, yoyo: true, repeat: 2 });
      burst(this, b.centerX, b.centerY, 'p_heart', 12);
      if (this.bubble) { this.tweens.killTweensOf(this.bubble); this.bubble.destroy(); this.bubble = null; }
    } });
    const earned = Math.max(1, 3 - (this.miss[a.id] || 0));
    this.say(`Yum! The ${a.name} eats ${a.eats}.`);
    this.time.delayedCall(700, () => {
      Sound.sfx('correct');
      for (let i = 0; i < earned; i++) flyStar(this, b.centerX - cam.scrollX + (i - (earned - 1) / 2) * 70, Math.max(330, b.centerY - 60), GW - 486, 78, i * 170, () => {
        this.stars++; this.starText.setText(String(this.stars));
        this.tweens.add({ targets: this.starIcon, displayWidth: 96, displayHeight: 96, duration: 110, yoyo: true });
      });
    });
    const isNew = !Save.data.stickers[a.id]; Save.data.stickers[a.id] = 1; Save.store();
    this.helped++;
    this.time.delayedCall(2100, () => factCard(this, a, { stars: earned, isNew, onClose: () => this.afterCard() }));
  }
  afterCard(){
    this.foodCards.forEach(c => c.destroy()); this.foodCards = [];
    this.phase = 'pick'; this.current = null;
    this.slots.forEach((c, i) => { if (c) this.tweens.add({ targets: c, y: c.homeY, duration: 300, ease: 'Back.easeOut' }); else this.fillSlot(i, 150); });
    this.refreshTray();
    if (this.slots.every(c => !c)) { this.finish(); return; }
    this.say('Great helping! Choose another animal.');
  }
  finish(){
    this.phase = 'done';
    const wk = this.wkey, max = this.W.animals.length * 3, old = Save.data.best[wk] || 0, isBest = this.stars > old;
    if (isBest) { Save.data.best[wk] = this.stars; Save.store(); }
    const ratio = this.stars / max;
    this.say('You helped every animal. Amazing work!');
    resultsBoard(this, {
      title: `${this.W.title} complete!`, rating: ratio >= .9 ? 3 : ratio >= .65 ? 2 : 1,
      line: `You earned ${this.stars} of ${max} stars`,
      best: isBest ? (old ? 'New high score!' : 'Your first high score!') : `Your best: ${old} stars`,
      tip: 'How you can help: ' + this.W.tip,
      buttons: [
        { label: 'Play again', col: 'green', cb: () => go(this, 'World', { world: wk }) },
        { label: 'Quiz', col: 'orange', cb: () => go(this, 'Quiz') },
        { label: 'Home', col: 'blue', cb: () => go(this, 'Menu') }
      ]
    });
  }

  update(time, delta){
    const cam = this.cameras.main, dt = delta / 1000, p = this.input.activePointer;
    const draggingAnimal = this.dragObj && this.dragObj.kind === 'animal';
    if (draggingAnimal) {                                   // carry an animal to the edge to keep walking
      if (p.x < 190) this.targetX -= 1700 * dt * (1 - p.x / 190 + .25);
      else if (p.x > GW - 190) this.targetX += 1700 * dt * ((p.x - (GW - 190)) / 190 + .25);
    }
    this.targetX = Phaser.Math.Clamp(this.targetX, 0, this.WW - GW);
    cam.scrollX += (this.targetX - cam.scrollX) * Math.min(1, dt * 7);

    const zi = Phaser.Math.Clamp(Math.round(cam.scrollX / ZW), 0, this.nz - 1);
    if (zi !== this.zoneNow) {
      this.zoneNow = zi;
      this.pills.forEach((c, i) => { const on = i === zi; c.onImg.setVisible(on); c.txt.setColor(on ? '#ffffff' : '#6b4420').setStroke('#2a6b17', on ? 6 : 0); });
    }
    const free = this.phase === 'pick';
    this.arrowL.setVisible(free && this.targetX > 10); this.arrowR.setVisible(free && this.targetX < this.WW - GW - 10);
    this.pills.forEach(c => c.setAlpha(free ? 1 : .6));

    if (draggingAnimal && p.y < TRAY_TOP) {
      const hz = Phaser.Math.Clamp(Math.floor((p.x + cam.scrollX) / ZW), 0, this.nz - 1);
      this.glow.setVisible(true).setX(hz * ZW + 60);
      this.signs.forEach((s, i) => s.setScale(i === hz ? 1.14 : 1));
    } else if (this.glow.visible || !draggingAnimal) { this.glow.setVisible(false); this.signs.forEach(s => s.setScale(1)); }
  }
}

/* ---------- Quiz ---------- */
function buildQuiz(){
  const S = Phaser.Utils.Array.Shuffle, pool = S(ANIMALS.slice()), low = a => a.name.toLowerCase();
  const hab = a => ({ pic: a.id, q: `Where does the ${low(a)} live?`,
    options: S(WORLDS[a.world].zones.map(z => ({ text: z.name, ok: z.name === a.zoneName }))), why: `The ${low(a)} lives in the ${a.zoneName}.` });
  const food = a => ({ pic: a.id, q: `What does the ${low(a)} eat?`,
    options: S([a.food].concat(a.wrong).map(f => ({ text: FOODS[f].name, icon: 'food_' + f, ok: f === a.food }))), why: `The ${low(a)} eats ${a.eats}.` });
  const diet = want => {
    const yes = pool.find(a => a.diet === want), others = pool.filter(a => a.diet === (want === 'carn' ? 'herb' : 'carn')).slice(0, 2);
    return { pic: null, q: want === 'carn' ? 'Which animal is a meat-eater (a carnivore)?' : 'Which animal is a plant-eater (a herbivore)?',
      options: S([yes].concat(others).map(a => ({ text: a.name, icon: 'animal_' + a.id, ok: a === yes }))),
      why: `The ${low(yes)} eats ${yes.eats}, so it is a ${DIETS[want].label.toLowerCase()}.` };
  };
  const facts = S(QUIZ_FACTS.slice()).slice(0, 2).map(f => ({ pic: f.pic, q: f.q, options: S(f.o.map((t, i) => ({ text: t, ok: i === 0 }))), why: f.why }));
  return S([hab(pool[0]), hab(pool[1]), food(pool[2]), food(pool[3]), diet('carn'), diet('herb')].concat(facts));
}

class QuizScene extends Phaser.Scene {

  showQ(){
    this.opts.forEach(o => o.destroy()); this.opts = []; if (this.fb) { this.fb.destroy(); this.fb = null; }
    const q = this.qs[this.qi]; this.locked = false; this.tries = 0;

    const n = q.options.length, pos = n === 4 ? [[560, 640], [1360, 640], [560, 800], [1360, 800]] : n === 3 ? [[560, 640], [1360, 640], [960, 800]] : [[560, 700], [1360, 700]];
    q.options.forEach((o, i) => this.opts.push(this.makeOption(o, pos[i][0], pos[i][1], i)));
  }
  makeOption(o, x, y, i){
    const w = 760, h = 132, face = this.add.image(0, 0, btnTex(this, w, h, 'cream')).setOrigin(.5, btnOriginY(h));
    const c = this.add.container(x, y + 40, [face]); c.alpha = 0;

    const t = T(this, o.icon ? 60 : 0, -4, o.text, 40, '#5b3a1a', { wrap: o.icon ? 540 : 690 }); if (t.height > 120) t.setFontSize(32); c.add(t);
    c.setSize(w, h).setInteractive({ useHandCursor: true });
    c.on('pointerdown', () => { if (!this.locked && !c.dead) c.setScale(.96); });

    this.tweens.add({ targets: c, y, alpha: 1, duration: 300, delay: 120 + i * 90, ease: 'Back.easeOut' });
    return c;
  }
  answer(c, o, face, t){

    if (!o.ok) {
      this.tries++; c.dead = true; Sound.sfx('wrong');
      face.setTexture(btnTex(this, 760, 132, 'danger')); t.setColor('#ffffff'); c.setAlpha(.92); dangerBurst(this, c.x + 300, c.y - 4, false, 150);

    if (this.tries === 0) {

    }
    this.feedback((this.tries === 0 ? 'Correct! ' : 'That\'s it! ') + q.why, true);
  }
  feedback(msg, done){
    if (this.fb) this.fb.destroy();
    const c = this.fb = this.add.container(GW / 2, 968);

  }
  next(){

      line: `${this.score} of ${n} right on the first try`,

      tip: this.score >= n - 1 ? 'You are a real animal expert! Can you help every animal in all three worlds?' : 'Play the worlds again to learn more about each animal, then come back for another go.',
      buttons: [
        { label: 'New quiz', col: 'green', cb: () => go(this, 'Quiz') },
        { label: 'Home', col: 'blue', cb: () => go(this, 'Menu') }
      ]
    });
  }
}

/* ---------- Sticker book: every animal you have helped ---------- */
class StickerScene extends Phaser.Scene {
  constructor(){ super('Stickers'); }
  create(){
    menuBackdrop(this, .28);
    Sound.playMusic('menu');
    this.cameras.main.fadeIn(350, 16, 60, 26);
    this.overlayOpen = false; this.cells = [];
    Btn(this, 84, 80, 96, 96, '', 'wood', () => go(this, 'Menu'), { round: true, icon: 'home' });
    audioButtons(this, GW - 84, 80, 10);
    T(this, GW / 2, 84, 'Sticker Book', 84, '#ffe36a', { title: true, stroke: '#6e3a10', strokeW: 15, shadow: 6 });
    const got = Object.keys(Save.data.stickers).length;
    T(this, GW / 2, 1030, got === ANIMALS.length ? 'You collected every sticker. Wow!' : `Help animals in the worlds to collect their stickers: ${got} of ${ANIMALS.length} so far.`, 40, '#ffffff', { body: true, stroke: '#2a6b17', strokeW: 8 });
    this.tabs = Object.keys(WORLDS).map((wk, i) => {
      const x = GW / 2 + (i - 1) * 330;
      const b = Btn(this, x, 208, 310, 88, WORLDS[wk].title, 'cream', () => this.show(wk), { size: 40 });
      b.onFace = this.add.image(0, 0, btnTex(this, 310, 88, 'green')).setOrigin(.5, btnOriginY(88)).setVisible(false); b.addAt(b.onFace, 1); b.wk = wk; return b;
    });
    this.show('safari');
  }
  show(wk){
    this.tabs.forEach(b => { const on = b.wk === wk; b.onFace.setVisible(on); b.label.setColor(on ? '#ffffff' : '#6b4420').setStroke('#2a6b17', on ? 7 : 0); });
    this.cells.forEach(c => c.destroy()); this.cells = [];
    const list = WORLDS[wk].animals, cols = 6, cw = 284, ch = 340;
    list.forEach((a, i) => {
      const row = Math.floor(i / cols), inRow = Math.min(cols, list.length - row * cols), col = i % cols;
      const x = GW / 2 + (col - (inRow - 1) / 2) * cw, y = 460 + row * ch, have = !!Save.data.stickers[a.id];
      const c = this.add.container(x, y + 30); c.alpha = 0;
      c.add(Panel(this, 0, 0, 262, 312, 'card'));
      c.add(fit(this.add.image(0, -30, have ? 'animal_' + a.id : silhouetteTex(this, a.id)), 200));
      if (!have) c.add(T(this, 0, -34, '?', 110, '#ffffff', { title: true, stroke: '#8fa57a', strokeW: 10 }));
      const lab = T(this, 0, 112, have ? a.name : '???', 28, have ? '#6b4420' : '#a89a78'); if (lab.width > 240) lab.setFontSize(22); c.add(lab);
      c.setSize(262, 312).setInteractive({ useHandCursor: true });
      c.on('pointerup', () => {
        if (this.overlayOpen) return;
        if (have) { Sound.sfx('click'); factCard(this, a, { next: 'Close' }); }
        else { Sound.sfx('wrong'); this.tweens.add({ targets: c, angle: 4, duration: 60, yoyo: true, repeat: 3, onComplete: () => c.setAngle(0) }); }
      });
      this.tweens.add({ targets: c, y, alpha: 1, duration: 260, delay: i * 40, ease: 'Back.easeOut' });
      this.cells.push(c);
    });
  }
}

/* ============================================================
   10. START
   ============================================================ */
window.addEventListener('load', async () => {
  if (!window.Phaser) {
    document.getElementById('splashMsg').textContent = 'Wild Worlds could not load its game engine. Please check the internet connection and try again.';
    return;
  }
  Save.load(); Sound.probe();
  try {
    await Promise.race([
      Promise.allSettled(['600 32px Fredoka', '32px "Lilita One"', '32px "Patrick Hand"', '32px Cranberry', '32px "Handy Casual"'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (e) { /* fall back to system fonts */ }

  window.wildWorlds = new Phaser.Game({
    /* Opened straight from disk, browsers block WebGL from reading local image
       files, so the canvas renderer is used there. On a web server WebGL is used. */
    type: location.protocol === 'file:' ? Phaser.CANVAS : Phaser.AUTO,
    parent: 'game', backgroundColor: '#1d5c2a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: GW, height: GH },
    loader: { imageLoadType: 'HTMLImageElement' },
    input: { activePointers: 2 },
    render: { antialias: true, roundPixels: false },
    scene: [BootScene, MenuScene, WorldScene, QuizScene, StickerScene]
  });
});
</script>
